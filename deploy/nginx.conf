# Rate limits: generous for browsing, strict for the endpoints that fork graphs.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=heavy:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # fork-heavy endpoints
    location ~ ^/api/(simulate|tournament|heal|remediate-pr|vaccinate)(/stream)?$ {
        limit_req zone=heavy burst=6 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;          # keep the SSE agent stream live
        proxy_read_timeout 300s;
    }

    location ~ ^/(api|mcp) {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=general burst=80 nodelay;
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
